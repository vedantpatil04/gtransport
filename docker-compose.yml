# Local development database for the Gangamata Transport backend.
# Usage: docker compose up -d postgres   (then: cd backend && npm run db:migrate)
name: gangamata

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gangamata
      POSTGRES_PASSWORD: gangamata
      POSTGRES_DB: gangamata
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - gangamata_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gangamata -d gangamata']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: gangamata_postgres_data

networks:
  gangamata_network:
    name: gangamata_network

