# Render Blueprint for Gangamata Transport API
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gangamata-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: log
      # Sensitive variables: configure in the Render Dashboard
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "10"
      # Auto-generates a secure 256-bit random key on blueprint creation
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      # Production Vercel frontend URL
      - key: CORS_ORIGINS
        value: https://gtransportt.vercel.app
      # AI Provider: 'dify' (cloud) or 'ollama' (external host). Note: 127.0.0.1 is not reachable on Render.
      - key: AI_PROVIDER
        sync: false
      # File storage: Cloudinary for durable persistent storage across restarts and deploys
      - key: FILE_STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: gangamata
